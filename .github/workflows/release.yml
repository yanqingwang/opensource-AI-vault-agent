name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Obsidian refuses to publish a release whose tag is not the manifest
      # version, and silently ignores a `v` prefix.
      - name: Check tag matches manifest version
        run: |
          ver="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest.json version $ver"
            exit 1
          fi

      # Artifact attestations let users cryptographically verify that the
      # release assets were built from this repository by GitHub Actions.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Only the three files Obsidian downloads are attached to the release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
